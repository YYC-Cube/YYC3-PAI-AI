# =============================================================================
# Local PostgreSQL (+ pgvector) for YYC3-Pai dual-backend development / tests
#
# From repo root:
#   docker compose -f docker/docker-compose.postgres.yml up -d
#   docker compose -f docker/docker-compose.postgres.yml down
#
# Connection (default):
#   postgresql://yyc3:yyc3@127.0.0.1:5432/yyc3_pai
#
# For pytest / YYC3-Pai:
#   export YYC3_TEST_DATABASE_URL='postgresql://yyc3:yyc3@127.0.0.1:5432/yyc3_pai'
#   export YYC3_DATABASE_URL='postgresql://yyc3:yyc3@127.0.0.1:5432/yyc3_pai'
#
# 旧变量 OCTOP_* 仍作为兜底兼容。
#
# Init layers (ADR 002):
#   - Control-plane schema → YYC3-Pai migrate (NNN_*.pg.sql), not this compose
#   - CREATE EXTENSION vector → postgres/init-vector.sql (initdb.d only)
#   - Agent memory tables → yyc3-memory at runtime
# =============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yyc3-pai-postgres
    restart: unless-stopped
    ports:
      - "${YYC3_PG_PORT:-${OCTOP_PG_PORT:-5432}}:5432"
    environment:
      POSTGRES_USER: ${YYC3_PG_USER:-${OCTOP_PG_USER:-yyc3}}
      POSTGRES_PASSWORD: ${YYC3_PG_PASSWORD:-${OCTOP_PG_PASSWORD:-yyc3}}
      POSTGRES_DB: ${YYC3_PG_DB:-${OCTOP_PG_DB:-yyc3_pai}}
    volumes:
      - yyc3_pai_pgdata:/var/lib/postgresql/data
      - ./postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  yyc3_pai_pgdata:
