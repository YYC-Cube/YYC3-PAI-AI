# =============================================================================
# YYC3-Pai — Remote Phone (mobile) compose file for local / DinD testing
#
# Usage (from repo root):
#   # once: download platform-tools next to the repo
#   mkdir -p .tools && cd /tmp && curl -fsSL -o pt.zip \
#     https://dl.google.com/android/repository/platform-tools-latest-linux.zip \
#     && unzip -qo pt.zip -d /workspace/YYC3-Pai/.tools
#
#   docker compose -f docker/docker-compose.mobile.yml up -d --build
#
# This file is standalone (not an overlay) because ``network_mode: host``
# conflicts with published ``ports`` from the base compose file.
#
# Host prerequisites:
# - Docker socket usable by the container
# - /dev/binder or /dev/binderfs on the host
# - Enough free disk for the Redroid image
#
# 旧变量 OCTOP_* 仍作为兜底兼容。
# =============================================================================

services:
  pai:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: yyc3-pai:latest
    container_name: yyc3-pai
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ${YYC3_DATA:-${OCTOP_DATA:-~/.yyc3-pai}}:/data/.yyc3-pai
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/binderfs:/dev/binderfs
      - ${YYC3_PLATFORM_TOOLS:-../.tools/platform-tools}:/opt/android-sdk/platform-tools:ro
    environment:
      - HOME=/data
      - YYC3_BIND_HOST=0.0.0.0
      - YYC3_PORT=${YYC3_PORT:-${OCTOP_PORT:-8088}}
      - YYC3_LOG_LEVEL=${YYC3_LOG_LEVEL:-${OCTOP_LOG_LEVEL:-info}}
      - YYC3_DEFAULT_PASSWORD=${YYC3_DEFAULT_PASSWORD:-${OCTOP_DEFAULT_PASSWORD:-}}
      - YYC3_ADMIN_USERNAME=${YYC3_ADMIN_USERNAME:-${OCTOP_ADMIN_USERNAME:-admin}}
      - YYC3_MOBILE_ADB_HOST=${YYC3_MOBILE_ADB_HOST:-${OCTOP_MOBILE_ADB_HOST:-127.0.0.1:5555}}
      - YYC3_MOBILE_CONTAINER=${YYC3_MOBILE_CONTAINER:-${OCTOP_MOBILE_CONTAINER:-yyc3-mobile-android}}
      - YYC3_ENABLE_MOBILE=${YYC3_ENABLE_MOBILE:-${OCTOP_ENABLE_MOBILE:-1}}
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
