name: ✨ 功能请求 | Feature Request
description: 提出新功能或改进建议 Propose a new feature or improvement
title: "[Feature]: "
labels: ["feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        描述清楚「问题」与「价值」，比描述「方案」更重要。
        A clear problem & value statement matters more than a solution sketch.

  - type: dropdown
    id: module
    attributes:
      label: 目标模块 | Target Module
      options:
        - "mod:00 模版总览 Templates"
        - "mod:01 理论基础 Theory"
        - "mod:02 设计实践 Design"
        - "mod:03 开发工程 DevOps"
        - "mod:04 质量保障 Quality"
        - "mod:05 安全合规 Security"
        - "mod:06 运维监控 Monitoring"
        - "mod:07 案例分析 Cases"
        - "mod:08 工具平台 Tooling"
        - "mod:09 智能演进 Evolution"
        - "mod:10 研学文库 Library"
        - "mod:11 模型架构 Model"
        - "mod:12 企业蓝图 Blueprints"
        - "mod:13 代码示例 Code examples"
        - "mod:infra 基础设施 Infra"
        - "mod:docs 站点文档 Dev docs"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题/动机 | Problem & Motivation
      description: 当前哪里不方便或不完整 What is missing or painful today
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 | Proposed Solution
      description: 期望的行为与大致实现思路 Desired behavior & rough approach
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 | Alternatives Considered

  - type: checkboxes
    id: ack
    attributes:
      label: 确认 | Acknowledgement
      options:
        - label: 我已搜索现有 Issue，确认无重复 I have searched existing issues for duplicates
          required: true
