name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: "🔍 Lint · ruff + mypy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install ruff mypy -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy (strict)
        run: mypy --strict 13-YYC3-企业蓝图-代码示例/1300-代码示例-核心基础设施

  unit-test:
    name: "🧪 Unit Test · pytest + coverage"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Pytest with coverage
        run: |
          pytest --cov=13-YYC3-企业蓝图-代码示例 --cov-report=xml --cov-fail-under=80 -q
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  security-scan:
    name: "🛡️ Security Scan · CodeQL + Trivy + gitleaks"
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy repo scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  build:
    name: "📦 Build · wheel + sdist"
    runs-on: ubuntu-latest
    needs: [unit-test, security-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  docker:
    name: "🐳 Docker · GHCR push"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: "❌ Failure Alert"
    runs-on: ubuntu-latest
    needs: [lint, unit-test, security-scan, build, docker]
    if: failure()
    steps:
      - name: Send alert
        run: |
          echo "CI failed on ${{ github.ref }} — notify dev@yanyucloud.com / ops@yanyucloud.com"
          # 可选接入 Slack/钉钉 Webhook（Secrets 配置 WEBHOOK_URL）
          # curl -X POST -H 'Content-Type: application/json' \
          #   -d '{"text":"YYC3 CI failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
          #   "${{ secrets.WEBHOOK_URL }}"
